[package]
name = "rmk-palettefx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Palette-sampled RGB matrix effects ported from Pascal Getreuer's PaletteFx module."
repository = "https://github.com/jpds/rmk-palettefx"
keywords = ["no-std", "embedded", "rgb", "keyboard"]
categories = ["embedded", "no-std"]

[dependencies]
micromath = { version = "2.1", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_pcg = { version = "0.10", default-features = false }

# `rmk-lighting` adapter dependencies. The lighting module only exists in the
# colonelpanic8 fork; consumers building from a workspace should [patch] this
# git source to their vendored copy.
rmk = { git = "https://github.com/colonelpanic8/rmk", branch = "master", default-features = false, features = ["lighting"], optional = true }
embassy-sync = { version = "0.8", optional = true }
heapless = { version = "0.9", optional = true }

[features]
## `LightingSource` adapter plugging the PaletteFx effects into RMK's
## topology-aware lighting engine.
rmk-lighting = ["dep:rmk", "dep:embassy-sync", "dep:heapless"]

[build-dependencies]
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", features = ["derive"] }
